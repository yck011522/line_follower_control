; Interactive E2 motor commissioning firmware; no motion on startup.
[platformio]
default_envs = e2_motor_speed

[env]
; Pin the community PlatformIO integration for Espressif Arduino 3.3.12.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -DCORE_DEBUG_LEVEL=0 ; Silence I2C diagnostics
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0

[env:e1_motor_communication]
build_src_filter = -<*> +<e1_motor_communication/>

[env:e2_motor_speed]
build_src_filter = -<*> +<e2_motor_speed/>

[env:e3_line_sensor]

build_src_filter = -<*> +<e3_line_sensor/>

[env:e4_line_sensor_library]
build_src_filter = -<*> +<e4_line_sensor_library/>

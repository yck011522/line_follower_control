; Interactive E2 motor commissioning firmware; no motion on startup.
[platformio]
default_envs = e2_motor_speed

[env]
; Pin the community PlatformIO integration for Espressif Arduino 3.3.12.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -DCORE_DEBUG_LEVEL=0 ; Silence I2C diagnostics
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
master_radio_com_port = COM11

[env:e2_motor_speed]
build_src_filter = -<*> +<e2_motor_speed/>

[env:e3_line_sensor]
build_src_filter = -<*> +<e3_line_sensor/>

[env:e4_line_sensor_library]
build_src_filter = -<*> +<e4_line_sensor_library/>

[env:e5_line_follow]
build_src_filter = -<*> +<e5_line_follow/>

[env:e6_line_sensor_reliability]
build_src_filter = -<*> +<e6_line_sensor_reliability/>

; E7 uses the lab network settings from esp32_broadcast_research.
; The AP must stay on channel 6 to match the existing master radio.
; Change these values together if recording on another network.
[e7_network]
wifi_ssid = M7026 Lab Router 2G
wifi_password = 70267026
gateway = 192,168,0,1
static_ota_ip = 192,168,0,100 ;IP for the Robot Car to reveive OTA updates. 
ota_password = ota7026

; First flash/recovery over USB. E7 never commands powered motion.
[env:e7_data_collection]
build_src_filter = -<*> +<e7_data_collection/>
build_flags =
    ${env.build_flags}
    -D CAR_ID=1
    '-D WIFI_SSID="${e7_network.wifi_ssid}"'
    '-D WIFI_PASSWORD="${e7_network.wifi_password}"'
    -D STATIC_OTA_IP=${e7_network.static_ota_ip}
    -D GATEWAY_ADDRESS=${e7_network.gateway}
    '-D OTA_HOSTNAME="e7-car1"'
    '-D OTA_PASSWORD="${e7_network.ota_password}"'

; Same firmware and settings, uploaded through the AP after the first USB flash.
[env:e7_data_collection_ota]
extends = env:e7_data_collection
upload_protocol = espota
upload_port = ${e7_network.static_ota_ip}
upload_flags = --auth=${e7_network.ota_password}

[env:e7_telemetry_master]
build_src_filter = -<*> +<e7_telemetry_master/>
upload_port = ${env.master_radio_com_port}

[env:e8_line_nfc_shared_i2c]
build_src_filter = -<*> +<e8_line_nfc_shared_i2c/>
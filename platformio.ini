; Configuration only: E2 firmware has not been implemented or uploaded.
[platformio]
default_envs = e2_motor_driver

[env:e2_motor_driver]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = -<*> +<e2_motor_driver/>
monitor_speed = 115200
; Select the detected port explicitly at run time; do not pin COM4 here.
; The installed board definition already enables native USB CDC.
; All project pin numbers use board D labels.
; Motor wiring: SDA D4 (GPIO5), SCL D5 (GPIO6), matching board defaults.
; Future firmware should use D4/D5 aliases explicitly.

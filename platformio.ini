; Interactive E12 motor, line sensor, and NFC firmware; no motion on startup.
[platformio]
default_envs = e12_motor_line_nfc

[env]
; Pin the community PlatformIO integration for Espressif Arduino 3.3.12.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -DCORE_DEBUG_LEVEL=0 ; Silence I2C diagnostics
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
master_radio_com_port = COM11

[env:e3_line_sensor]
build_src_filter = -<*> +<e3_line_sensor/>

[env:e5_line_follow]
build_src_filter = -<*> +<e5_line_follow/>

[env:e7_telemetry_master]
build_src_filter = -<*> +<e7_telemetry_master/>
upload_port = ${env.master_radio_com_port}

[env:e9_line_nfc_shared_i2c]
build_src_filter = -<*> +<e9_line_nfc_shared_i2c/>

[env:e8_nfc_fm17550_i2c]
build_src_filter = -<*> +<e8_nfc_fm17550_i2c/>

[env:e9b_nfc_serial_monitor]
build_src_filter = -<*> +<e9b_nfc_serial_monitor/> +<e8_nfc_fm17550_i2c/NfcAsync.cpp>

[env:e10_line_nfc_control]
build_src_filter = -<*> +<e10_line_nfc_control/> +<e8_nfc_fm17550_i2c/NfcAsync.cpp>

[env:e11_motor_test]
build_src_filter = -<*> +<e11_motor_test/>

[env:e12_motor_line_nfc]
build_src_filter = -<*> +<e12_motor_line_nfc/> +<e8_nfc_fm17550_i2c/NfcAsync.cpp>

; E13: E12 motor/line/NFC control with Test 14 BLE transport.
[env:e13_car_1]
build_src_filter = -<*> +<e13/car/> +<e8_nfc_fm17550_i2c/NfcAsync.cpp>
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags = ${env.build_flags} -I src/e13/include -D BLE_CAR_ID=1
upload_port = COM13

[env:e13_car_2]
extends = env:e13_car_1
build_flags = ${env.build_flags} -I src/e13/include -D BLE_CAR_ID=2

[env:e13_car_3]
extends = env:e13_car_1
build_flags = ${env.build_flags} -I src/e13/include -D BLE_CAR_ID=3

[env:e13_car_4]
extends = env:e13_car_1
build_flags = ${env.build_flags} -I src/e13/include -D BLE_CAR_ID=4

; E14: E13 plus left/right/center line-edge following selected by World State turn bits.
; Uses the E13 modem and shared headers.
[env:e14_car_1]
extends = env:e13_car_1
build_src_filter = -<*> +<e14/car/> +<e8_nfc_fm17550_i2c/NfcAsync.cpp>

; E15 uses the E13 modem and shared wire protocol.
[env:e15_car_1]
extends = env:e13_car_1
build_src_filter = -<*> +<e15/car/> +<e8_nfc_fm17550_i2c/NfcAsync.cpp>

[env:e13_modem]
build_src_filter = -<*> +<e13/modem/>
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags = ${env.build_flags} -I src/e13/include -include src/e13/include/ble14_modem_config.h
upload_port = COM15

; E16: unrestricted UID reporting and bounded NFC recovery; existing E13 modem.
[env:e16_car_1]
extends = env:e13_car_1
build_src_filter = -<*> +<e16/car/> +<e8_nfc_fm17550_i2c/NfcAsync.cpp>

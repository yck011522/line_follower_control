; Interactive E2 motor commissioning firmware; no motion on startup.
[platformio]
default_envs = e2_motor_speed

[env]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Select the detected port explicitly at run time; do not pin COM4 here.
; The installed board definition already enables native USB CDC.
; All project pin numbers use board D labels.
; Motor wiring: SDA D4 (GPIO5), SCL D5 (GPIO6), matching board defaults.
; Firmware uses D4/D5 aliases explicitly.

[env:e1_motor_communication]
build_src_filter = -<*> +<e1_motor_communication/>

[env:e2_motor_speed]
build_src_filter = -<*> +<e2_motor_speed/>
